name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # nvcc is not preinstalled on the runner image; it comes from the Ubuntu
      # package (same nvcc 12.0 as the local toolchain). Retries guard against
      # transient mirror or DNS failures.
      - name: Install toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends nvidia-cuda-toolkit

      - name: Print tool versions
        run: |
          nvcc --version
          g++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLBM_WARNINGS_AS_ERRORS=ON
          -DLBM_ENABLE_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=86

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # The GPU tests are built (and their discovery needs no GPU) but not run:
      # GitHub-hosted runners have no GPU. They are run locally.
      - name: Test (CPU only)
        run: ctest --test-dir build -LE gpu --output-on-failure

  # No CUDA: the CPU tests built with FMA instructions enabled. The exact tests
  # must still pass because the test targets disable FP contraction.
  # g++, cmake and make are preinstalled on the runner image: no apt-get, so
  # this job does not depend on the Ubuntu package mirrors.
  cpu-fma:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Print tool versions
        run: |
          g++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLBM_ENABLE_CUDA=OFF
          -DLBM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=-march=x86-64-v3

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # No CUDA: the CPU tests under AddressSanitizer and UndefinedBehaviorSanitizer.
  # Uses the preinstalled toolchain, as cpu-fma.
  cpu-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Print tool versions
        run: |
          g++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DLBM_ENABLE_CUDA=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
